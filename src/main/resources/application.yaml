server:
  servlet:
    context-path: /

spring:
  application:
    name: recipecatalogue
  profiles:
    active: local
    default: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      indent-output: true
    time-zone: UTC
  config:
    import: classpath:application.env.properties
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: false

jwt:
  private-key-file: classpath:jwt-private-key.pem
  public-key-file: classpath:jwt-public-key.pem

springdoc:
  api-docs:
    enabled: true
    path: /api-spec.yaml
  swagger-ui:
    enabled: true
    path: /docs
