services:

  postgres:
    image: postgres:17-alpine
    restart: always
    container_name: postgres
    environment:
      POSTGRES_DB: recipe-catalogue
      POSTGRES_USER: ${RECIPE_CATALOGUE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RECIPE_CATALOGUE_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ${RECIPE_CATALOGUE_POSTGRES_DIRECTORY:-postgres-volume}:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: always
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-volume:/data

volumes:

  postgres-volume:

  redis-volume:
