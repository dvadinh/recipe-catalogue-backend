server:
  servlet:
    context-path: /
    session:
      cookie:
        name: SESSION
        same-site: lax
        path: /
        http-only: true
        secure: false
  port: ${SERVER_PORT:8081}

spring:
  jpa:
    hibernate:
      ddl-auto: create
  datasource:
    host: localhost
    port: 5432
    db-name: recipe-catalogue
    username: recipe-catalogue-user
    password: 12345678
    url: jdbc:postgresql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.db-name}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      client-type: lettuce

flyway:
  baseline-on-migrate: true
  validate-migration-naming: true
  locations: classpath:db/migration/local/
  baseline-version:
  target-version:

jwt:
  private-key-file: classpath:jwt-private-key.pem
  public-key-file: classpath:jwt-public-key.pem

oauth2:
  client:
    registration:
      google:
        client-id: ${GOOGLE_OIDC_CLIENT_ID}
        client-secret: ${GOOGLE_OIDC_CLIENT_SECRET}
        scope:
          - openid
          - email
          - profile
        authorization-grant-type: authorization_code
        redirect-uri: http://localhost:${server.port}/auth/oauth2/code/google
      github:
        client-id: ${GITHUB_OAUTH2_CLIENT_ID}
        client-secret: ${GITHUB_OAUTH2_CLIENT_SECRET}
        scope:
          - read:user
        authorization-grant-type: authorization_code
        redirect-uri: http://localhost:${server.port}/auth/oauth2/code/github
    provider:
      google:
        issuer-uri: https://accounts.google.com
      github:
        issuer-uri: https://github.com/login/oauth

logging:
  level:
    org.springframework.security: trace
