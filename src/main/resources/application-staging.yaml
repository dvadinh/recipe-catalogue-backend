server:
  servlet:
    context-path: /
    session:
      cookie:
        name: SESSION
        same-site: lax
        path: /
        http-only: true
        secure: true
        domain: api.recipecatalogue.com
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  address: 127.0.0.1

spring:
  jpa:
    hibernate:
      ddl-auto: create
  datasource:
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    db-name: ${POSTGRES_DATABASE_NAME}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    url: jdbc:postgresql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.db-name}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      client-type: lettuce

flyway:
  baseline-on-migrate: true
  validate-migration-naming: true
  locations: classpath:db/migration/staging/
  baseline-version:
  target-version:

oauth2:
  client:
    registration:
      google:
        client-id: ${GOOGLE_OIDC_CLIENT_ID}
        client-secret: ${GOOGLE_OIDC_CLIENT_SECRET}
        scope:
          - openid
          - email
          - profile
        authorization-grant-type: authorization_code
        redirect-uri: https://${server.servlet.session.cookie.domain}/auth/oauth2/code/google
      github:
        client-id: ${GITHUB_OAUTH2_CLIENT_ID}
        client-secret: ${GITHUB_OAUTH2_CLIENT_SECRET}
        scope:
          - read:user
        authorization-grant-type: authorization_code
        redirect-uri: https://${server.servlet.session.cookie.domain}/auth/oauth2/code/github
    provider:
      google:
        issuer-uri: https://accounts.google.com
      github:
        issuer-uri: https://github.com/login/oauth
